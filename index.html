<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>결혼합니다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #faf8f5;
  --card-bg: #ffffff;
  --text-main: #2b2b2b;
  --text-muted: #726d68;
  --text-light: #9c958f;
  --primary: #4a3e3d;
  --accent: #937365;
  --line: #ede7e1;
  --line-light: #f5f0eb;
  --shadow-sm: 0 4px 16px rgba(43, 43, 43, 0.04);
  --shadow-md: 0 8px 24px rgba(43, 43, 43, 0.06);
  color-scheme: light;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text-main);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  line-height: 1.85;
  font-size: 15px;
  word-break: keep-all;
  overflow-wrap: break-word;
}

main {
  max-width: 440px;
  margin: 0 auto;
  background: var(--bg);
  min-height: 100vh;
  box-shadow: var(--shadow-md);
  position: relative;
}

.serif { font-family: 'Gowun Batang', serif; }
.en { font-family: 'Cormorant Garamond', serif; letter-spacing: 0.1em; }

/* Hero Section */
.hero {
  min-height: 85vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 50px 24px;
  text-align: center;
  background: radial-gradient(circle at 50% 25%, #ffffff 0%, var(--bg) 80%);
}
.hero .tagline {
  font-size: 12px;
  letter-spacing: 0.28em;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 24px;
}
.hero .names-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin: 8px 0 16px;
}
.hero .name {
  font-size: 22px; /* 기존 34px에서 단정하고 세련된 크기로 축소 */
  color: var(--primary);
  font-weight: 400;
  letter-spacing: 0.08em;
}
.hero .ampersand {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 18px;
  color: var(--accent);
  font-weight: 400;
}
.hero .sub-text {
  font-size: 15px;
  color: var(--text-muted);
  margin-bottom: 6px;
  letter-spacing: 0.04em;
}
.hero .date-text {
  font-size: 13.5px;
  color: var(--text-light);
  letter-spacing: 0.08em;
}

/* Sections */
section {
  padding: 64px 28px;
  text-align: center;
}
.sec-title {
  margin: 0 0 10px;
  font-size: 12px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 600;
}
.sec-sub {
  margin: 0 0 32px;
  font-size: 20px;
  color: var(--primary);
  font-weight: 400;
}

.txt {
  white-space: pre-line;
  color: var(--text-main);
  line-height: 2.1;
  font-size: 15.5px;
}
.parents-box {
  margin-top: 36px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
  font-size: 14.5px;
  color: var(--text-muted);
  line-height: 2;
}

/* Minimal Divider */
.divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 0;
}
.divider::before, .divider::after {
  content: '';
  width: 32px;
  height: 1px;
  background: var(--line);
}
.divider span {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.6;
}

/* Calendar */
.cal-container {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 30px 24px 26px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  max-width: 330px;
  margin: 0 auto;
}
.cal-header {
  font-size: 18px;
  color: var(--primary);
  margin-bottom: 18px;
}
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  row-gap: 8px;
  column-gap: 2px;
  font-size: 14px;
}
.cal-grid span {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13.5px;
}
.cal-grid .dow {
  font-size: 12px;
  color: var(--text-light);
  font-weight: 500;
  padding-bottom: 6px;
}
.cal-grid .sun { color: #b86259; }
.cal-grid .on {
  background: var(--accent);
  color: #fff;
  border-radius: 50%;
  font-weight: 600;
  box-shadow: 0 3px 8px rgba(147, 115, 101, 0.35);
}

/* Gallery */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.tile {
  position: relative;
  border: none;
  padding: 0;
  background: var(--line-light);
  border-radius: 12px;
  overflow: hidden;
  aspect-ratio: 1 / 1;
  cursor: pointer;
}
.tile:first-child {
  grid-column: 1 / 3;
  aspect-ratio: 16 / 11;
}
.tile img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.4s ease;
}
.tile:active img {
  transform: scale(0.98);
}
.tile.ph {
  background: #f2ece4;
  position: relative;
}
.tile.ph::after {
  content: 'Photo';
  position: absolute;
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 15px;
  color: #c4b9af;
}

/* Notice Card */
.notice-card {
  background: var(--card-bg);
  border-radius: 20px;
  padding: 32px 24px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  max-width: 360px;
  margin: 0 auto;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 13px 26px;
  border-radius: 30px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #ffffff;
  font-size: 14.5px;
  cursor: pointer;
  transition: all 0.2s ease;
  letter-spacing: 0.02em;
}
.btn:active {
  transform: scale(0.97);
  opacity: 0.9;
}
.btn.ghost {
  background: var(--card-bg);
  border-color: var(--line);
  color: var(--text-main);
}
.btn.small {
  padding: 6px 14px;
  font-size: 13px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: #fcfbfa;
  color: var(--text-muted);
}
.row {
  display: flex;
  gap: 12px;
  justify-content: center;
}

/* Accounts Accordion */
.acc-item {
  background: var(--card-bg);
  border: 1px solid var(--line);
  border-radius: 16px;
  margin-bottom: 12px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  text-align: left;
}
.acc-head {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 22px;
  background: none;
  border: none;
  font-size: 15.5px;
  color: var(--primary);
  cursor: pointer;
  font-weight: 500;
}
.acc-head::after {
  content: '';
  width: 7px;
  height: 7px;
  border-right: 1.5px solid var(--accent);
  border-bottom: 1.5px solid var(--accent);
  transform: rotate(45deg);
  transition: transform 0.25s ease;
  margin-right: 4px;
}
.acc-head[aria-expanded="true"]::after {
  transform: rotate(-135deg);
}
.acc-body {
  padding: 4px 22px 18px;
  border-top: 1px solid var(--line-light);
}
.acc {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 13px 0;
  font-size: 14.5px;
}
.acc + .acc {
  border-top: 1px dashed var(--line);
}
.acc small {
  display: block;
  color: var(--text-muted);
  font-size: 13px;
  margin-top: 2px;
}

/* Toast & Lightbox */
footer {
  padding: 48px 20px 64px;
  text-align: center;
  font-size: 13px;
  color: var(--text-light);
  letter-spacing: 0.05em;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(32px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  background: rgba(43, 43, 43, 0.9);
  backdrop-filter: blur(8px);
  color: #fff;
  padding: 10px 20px;
  border-radius: 30px;
  font-size: 13.5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
  z-index: 99;
}
.toast.show { opacity: 1; }

.lb {
  position: fixed;
  inset: 0;
  background: rgba(20, 20, 20, 0.92);
  backdrop-filter: blur(10px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
}
.lb.open { display: flex; }
.lb img {
  max-width: 90%;
  max-height: 80vh;
  object-fit: contain;
  border-radius: 6px;
}
.lb button {
  position: absolute;
  border: none;
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.lb .x { top: calc(20px + env(safe-area-inset-top, 0px)); right: 20px; }
.lb .pv { left: 16px; top: 50%; transform: translateY(-50%); }
.lb .nx { right: 16px; top: 50%; transform: translateY(-50%); }
.lb .ct {
  position: absolute;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  font-size: 13px;
  color: rgba(255, 255, 255, 0.7);
  letter-spacing: 0.1em;
}
</style>
</head>
<body>
<main>

  <!-- Hero -->
  <section class="hero">
    <div class="tagline en">The Wedding Day</div>
    <div class="names-wrap">
      <span class="name serif" id="groom"></span>
      <span class="ampersand">&</span>
      <span class="name serif" id="bride"></span>
    </div>
    <p class="sub-text serif">소중한 분들을 초대합니다</p>
    <p class="date-text en" id="dateText"></p>
  </section>

  <!-- Message -->
  <section>
    <div class="sec-title en">Invitation</div>
    <h2 class="sec-sub serif">초대의 글</h2>
    <div class="txt serif" id="message"></div>
    <div class="parents-box" id="parents"></div>
  </section>

  <div class="divider"><span></span></div>

  <!-- Gallery -->
  <section>
    <div class="sec-title en">Gallery</div>
    <h2 class="sec-sub serif">소중한 순간</h2>
    <div class="gallery-grid" id="gallery"></div>
  </section>

  <div class="divider"><span></span></div>

  <!-- Calendar -->
  <section>
    <div class="sec-title en">Calendar</div>
    <h2 class="sec-sub serif">예식 일시</h2>
    <div class="cal-container">
      <div class="cal-header serif" id="month"></div>
      <div class="cal-grid" id="grid"></div>
    </div>
  </section>

  <div class="divider"><span></span></div>

  <!-- Notice -->
  <section>
    <div class="sec-title en">Information</div>
    <h2 class="sec-sub serif">전하는 말씀</h2>
    <div class="notice-card txt serif" id="notice"></div>
  </section>

  <!-- Accounts -->
  <section>
    <div class="sec-title en">Account</div>
    <h2 class="sec-sub serif">마음 전하실 곳</h2>
    <p class="txt" style="margin:-14px 0 24px; font-size:14px; color:var(--text-muted);" id="accIntro"></p>
    <div id="accounts"></div>
  </section>

  <!-- Share -->
  <section>
    <div class="row">
      <button class="btn" id="share">청첩장 공유하기</button>
      <button class="btn ghost" id="copy">링크 복사</button>
    </div>
  </section>

  <footer id="footer" class="serif"></footer>
</main>

<!-- Lightbox -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="사진 보기">
  <button class="x" id="lbX" aria-label="닫기">✕</button>
  <button class="pv" id="lbP" aria-label="이전 사진">‹</button>
  <img id="lbImg" alt="">
  <button class="nx" id="lbN" aria-label="다음 사진">›</button>
  <div class="ct en" id="lbC"></div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
const INFO = {
  groom: "김효상",
  bride: "정찬주",
  date: "2026-11-17",
  time: "",
  message: "서로 아끼며 살아온 두 사람이\n하나의 길을 함께 걷기로 했습니다.\n\n가까운 가족과 조용히 예를 올리며\n새 출발의 기쁨을 나누려 합니다.",
  parents: "김광석 · 고미현의 아들 김효상\n정호길 · 홍순옥의 딸 정찬주",
  notice: "예식은 가족끼리 조용히 치릅니다.\n직접 모시지 못하는 점\n너그러운 양해 부탁드립니다.\n\n마음으로 보내주시는 따뜻한 축하에\n깊이 감사드립니다.",
  accIntro: "참석이 어려우신 분들을 위해\n계좌번호를 안내드립니다.",
  footer: "김효상 · 정찬주 드림",
  accounts: [
    {title: "신랑측", list: [{name: "김효상", bank: "OO은행", number: "000-0000-000000"}]},
    {title: "신부측", list: [{name: "정찬주", bank: "OO은행", number: "000-0000-000000"}]}
  ],
  images: []
};

const $ = id => document.getElementById(id);
const toast = m => {
  const t = $('toast');
  t.textContent = m;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
};
const copyText = async (s, ok) => {
  try {
    await navigator.clipboard.writeText(s);
    toast(ok);
  } catch (e) {
    toast('복사에 실패했습니다');
  }
};

$('groom').textContent = INFO.groom;
$('bride').textContent = INFO.bride;
$('message').textContent = INFO.message;
$('notice').textContent = INFO.notice;
$('accIntro').textContent = INFO.accIntro;
$('footer').textContent = INFO.footer;
$('parents').innerHTML = INFO.parents.split('\n').map(l => `<div>${l}</div>`).join('');

// Date / Calendar
const [Y, M, D] = INFO.date.split('-').map(Number);
const dows = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
const dayIdx = new Date(Y, M - 1, D).getDay();
$('dateText').textContent = `${Y}. ${String(M).padStart(2, '0')}. ${String(D).padStart(2, '0')} ${dows[dayIdx]}` + (INFO.time ? ` ${INFO.time}` : '');
$('month').textContent = `${Y}년 ${M}월`;

let h = dows.map((d, i) => `<span class="dow${i === 0 ? ' sun' : ''}">${d}</span>`).join('');
const first = new Date(Y, M - 1, 1).getDay();
const last = new Date(Y, M, 0).getDate();
for (let i = 0; i < first; i++) h += '<span></span>';
for (let d = 1; d <= last; d++) {
  const sun = (first + d - 1) % 7 === 0;
  h += `<span class="${d === D ? 'on' : sun ? 'sun' : ''}">${d}</span>`;
}
$('grid').innerHTML = h;

// Gallery
const imgs = INFO.images;
$('gallery').innerHTML = imgs.length
  ? imgs.map((s, i) => `<button class="tile" data-i="${i}" aria-label="사진 ${i + 1} 크게 보기"><img src="${s}" alt="사진 ${i + 1}" loading="lazy"></button>`).join('')
  : Array(6).fill('<div class="tile ph" aria-hidden="true"></div>').join('');

let cur = 0, sx = 0;
const show = i => {
  cur = (i + imgs.length) % imgs.length;
  $('lbImg').src = imgs[cur];$('lbImg').alt = `사진 ${cur + 1}`;
  $('lbC').textContent = `${cur + 1} / ${imgs.length}`;
};
const openLb = i => { show(i); $('lb').classList.add('open');$('lbX').focus(); };
const closeLb = () => $('lb').classList.remove('open');

$('gallery').onclick = e => {   const b = e.target.closest('.tile[data-i]');   if (b) openLb(+b.dataset.i); };$('lbX').onclick = closeLb;
$('lbP').onclick = () => show(cur - 1);$('lbN').onclick = () => show(cur + 1);
$('lb').addEventListener('touchstart', e => { sx = e.changedTouches[0].clientX; }, {passive: true});$('lb').addEventListener('touchend', e => {
  const d = e.changedTouches[0].clientX - sx;
  if (Math.abs(d) > 50) show(cur + (d < 0 ? 1 : -1));
});
document.addEventListener('keydown', e => {
  if (!$('lb').classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') show(cur - 1);
  if (e.key === 'ArrowRight') show(cur + 1);
});

// Accounts
$('accounts').innerHTML = INFO.accounts.map((g, gi) => `
<div class="acc-item">
  <button class="acc-head" aria-expanded="false" aria-controls="acc${gi}" data-g="${gi}">${g.title} 계좌번호</button>
  <div class="acc-body" id="acc${gi}" hidden>
    ${g.list.map((a, ai) => `<div class="acc"><div>${a.name}<small>${a.bank}${a.number}</small></div><button class="btn small" data-g="${gi}" data-a="${ai}">복사</button></div>`).join('')}
  </div>
</div>`).join('');

$('accounts').onclick = e => {
  const c = e.target.closest('.btn[data-a]');
  if (c) {
    const a = INFO.accounts[c.dataset.g].list[c.dataset.a];
    copyText(a.number, '계좌번호를 복사했습니다');
    return;
  }
  const hd = e.target.closest('.acc-head');
  if (hd) {
    const body = $('acc' + hd.dataset.g);
    const open = hd.getAttribute('aria-expanded') === 'true';
    hd.setAttribute('aria-expanded', String(!open));
    body.hidden = open;
  }
};

// Share
const url = location.href;
$('share').onclick = async () => {
  try {
    if (navigator.share) {
      await navigator.share({
        title: '결혼합니다',
        text: `${INFO.groom} · ${INFO.bride} 결혼 소식을 전합니다.`,
        url
      });
    } else {
      copyText(url, '링크를 복사했습니다');
    }
  } catch (e) {}
};
$('copy').onclick = () => copyText(url, '링크를 복사했습니다');
</script>
</body>
</html>
